[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matpy"
version = "0.5.0"
description = "A local Matlab compiler/interpreter written in Python"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
tables = ["pandas>=2.0"]
ml = ["scikit-learn>=1.3"]
image = ["scikit-image>=0.21"]
full = ["h5py>=3.8", "pandas>=2.0", "scikit-learn>=1.3", "scikit-image>=0.21"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
matpy = "matpy.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["matpy"]
omit = [
    "matpy/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]
